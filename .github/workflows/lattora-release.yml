name: Prepare Lattora release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to verify (for example v2.1.0)
        required: true
        type: string
      create_draft:
        description: Create or update a draft after all native archives pass
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lattora-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/lattora-packages.yml
    with:
      source_ref: ${{ inputs.tag || github.ref }}
  assemble:
    needs: packages
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Require the tag and POM to have the same stable version
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from lattora_context import ExecutionContext,version_tuple
          tag=os.environ['RELEASE_TAG']; version=ExecutionContext().version
          version_tuple(version)
          assert tag=='v'+version, 'Tag does not match pom.xml version'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('tag='+tag+'\n')
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lattora-*
          path: target/distribution
          merge-multiple: true
      - name: Require three passing native reports and generate the installer
        run: python3 -B scripts/build_lattora.py --release-metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lattora-release-candidate
          path: |
            target/distribution/*.tar.gz
            target/distribution/acceptance-*.json
            target/distribution/install.sh
            target/distribution/release.json
            target/distribution/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
  draft:
    if: github.event_name == 'push' || inputs.create_draft
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lattora-release-candidate
          path: candidate
      - name: Prepare a draft only; publication requires launch approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.assemble.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to alter a published release"'
          else
            cat > release-notes.md <<'TEXT'
          Lattora standalone terminal application for Linux x86-64, Linux ARM64 and Apple Silicon macOS.

          Python, Textual, Java 21, the simulation engine and independent validators are included. See release.json, SHA256SUMS and the native acceptance reports for verification evidence.

          Matching source and build materials: the lattora-*-sources.tar.gz asset (SHA-256 in SHA256SUMS). See its SOURCES.md and the SOURCES.md included in each standalone archive.

          This is a reviewable draft. Publish only after reviewing all native acceptance reports and receiving launch approval.
          TEXT
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Lattora ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" candidate/* --clobber
