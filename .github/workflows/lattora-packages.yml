name: Native Lattora archives

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
            machine: x86_64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            machine: aarch64
          - target: macos-arm64
            os: macos-15
            machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JAVA_HOME: ''
      MAVEN_ARGS: ''
      MAVEN_OPTS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Require native architecture and install locked UI
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          # Temurin's four-part patch version is not accepted by setup-java.
          # Reuse source setup's native download and checksum pins.
          python3 -B - <<'PYTHON'
          import sys
          sys.path.insert(0, 'scripts')
          from cloudsim_runtime import install_jdk
          install_jdk()
          PYTHON
          python3 -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-ui.lock
      - name: Full Java and Python verification with receipt
        run: |
          if [ "$RUNNER_OS" = macOS ]; then sudo /usr/sbin/purge; fi
          ./lattora.sh --test --plain --output-dir .cloudsim/native-verification
      - name: Assemble the native standalone archive
        env:
          TARGET: ${{ matrix.target }}
        run: python3 -B scripts/build_lattora.py --target "$TARGET"
      - name: Accept the actual archive without system application runtimes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then sudo /usr/sbin/purge; fi
          python3 -B scripts/accept_lattora.py --archive target/distribution/lattora-*"$TARGET".tar.gz --report "target/distribution/acceptance-$TARGET.json"
      - name: Verify explicit update networking with bundled Python
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cloudsim/update-tls
          tar -xzf target/distribution/lattora-*"$TARGET".tar.gz -C .cloudsim/update-tls
          .cloudsim/update-tls/lattora-*"$TARGET"/runtime/python/bin/python3 -B - <<'PYTHON'
          import os,urllib.request
          request=urllib.request.Request('https://api.github.com/repos/puneet-chandna/Lattora/releases?per_page=1',
              headers={'User-Agent':'lattora-native-acceptance','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:
              assert response.status==200, 'Release API TLS check failed'
          print('PASS: bundled Python can securely fetch release metadata')
          PYTHON
      - name: Retain the archive and its native acceptance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lattora-${{ matrix.target }}
          path: |
            target/distribution/*.tar.gz
            target/distribution/${{ matrix.target }}.json
            target/distribution/acceptance-${{ matrix.target }}.json
          compression-level: 0
          if-no-files-found: error
      - name: Retain verification and acceptance logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lattora-logs-${{ matrix.target }}
          path: |
            .cloudsim/native-verification/
            target/distribution/acceptance-*/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
